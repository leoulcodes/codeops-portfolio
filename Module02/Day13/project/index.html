
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kazanchis Pharmacy - Business Profile Card</title>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* 1. CSS Variables: HSL Palette & Spacing Scale */
    :root {
      /* HSL Palette */
      --brand-h: 160;
      --brand-s: 84%;
      --brand-l: 28%;
      
      --brand: hsl(var(--brand-h), var(--brand-s), var(--brand-l));
      --brand-hover: hsl(var(--brand-h), var(--brand-s), calc(var(--brand-l) + 12%)); /* Only lightness changed */
      
      --accent: hsl(43, 96%, 56%);
      --bg-page: hsl(210, 20%, 98%);
      --bg-card: hsl(0, 0%, 100%);
      --text-main: hsl(215, 28%, 17%);
      --text-muted: hsl(215, 16%, 47%);
      --border-color: hsl(214, 32%, 91%);
      
      /* Spacing Scale */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Card Metrics */
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    /* 2. Global Reset & Base Typography */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: var(--space-md);
    }

    /* 3. Centered Card Component */
    .card {
      background-color: var(--bg-card);
      width: 100%;
      max-width: 360px;
      margin: 40px auto;
      padding: var(--space-xl) var(--space-lg) var(--space-lg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* 4. Pseudo-element: Decorative Brand Accent Strip */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--space-sm);
      background: linear-gradient(90deg, var(--brand), var(--accent));
    }

    /* 5. Typographic Hierarchy */
    .location-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand);
      background-color: hsl(var(--brand-h), var(--brand-s), 95%);
      padding: var(--space-xs) var(--space-sm);
      border-radius: 4px;
      margin-bottom: var(--space-sm);
    }

    .business-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: var(--space-xs);
    }

    .tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--brand);
      margin-bottom: var(--space-md);
    }

    .description {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: var(--space-lg);
    }

    /* Business Details List */
    .info-list {
      list-style: none;
      border-top: 1px solid var(--border-color);
      padding-top: var(--space-md);
      margin-bottom: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .info-item {
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-label {
      color: var(--text-muted);
    }

    .telebirr-tag {
      color: #0088cc;
      font-weight: 600;
      font-size: 0.8rem;
    }

    /* 6. Contact Button & Hover State (HSL Lightness Transition) */
    .btn {
      display: block;
      width: 100%;
      background-color: var(--brand);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      padding: var(--space-sm) var(--space-md);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--brand-hover);
    }

    .btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- Business Profile Card -->
  <article class="card">
    <span class="location-badge">Kazanchis Branch</span>
    <h1 class="business-name">Selam Pharmacy</h1>
    <p class="tagline">24/7 Prescription &amp; Wellness Care</p>
    
    <p class="description">
      Providing authentic medicines, medical supplies, and personal health consultations right next to Inter Luxury Hotel.
    </p>

    <ul class="info-list">
      <li class="info-item">
        <span class="info-label">Hours</span>
        <span>Open 24 Hours</span>
      </li>
      <li class="info-item">
        <span class="info-label">Location</span>
        <span>Kazanchis, Addis Ababa</span>
      </li>
      <li class="info-item">
        <span class="info-label">Payment</span>
        <span class="telebirr-tag">TeleBirr Accepted</span>
      </li>
    </ul>

    <a href="tel:+251911123456" class="btn">Contact Pharmacy</a>
  </article>

</body>
</html>
