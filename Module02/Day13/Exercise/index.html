
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Eatery - Menu Card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Menu Card Component -->
  <article class="menu-card">
    <header class="menu-card-header">
      <h3 class="item-title">Habesha Special Burger</h3>
      <span class="item-price">450</span>
    </header>
    
    <p class="item-description">
      A house specialty featuring a spiced double patty layered with traditional Ethiopian seasonings.
    </p>

    <ul class="ingredient-list">
      <li>Double Prime Beef Patty</li>
      <li>Spicy Awaze Mayo</li>
      <li>Caramelized Onions</li>
      <li>Aged Cheddar Cheese</li>
      <li>Toasted Brioche Bun</li>
    </ul>
  </article>

</body>
</html>
