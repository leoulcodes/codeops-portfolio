

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Eats</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
        <header>
        <div class="header-content">
            <div class="brand">
                <span class="brand-icon">🍴</span>
                <div>
                    <h1>Addis Eats</h1>
                    <p>Authentic Ethiopian flavors</p>
                </div>
            </div>

            <div class="search-wrapper">
                <span class="search-icon">⌕</span>
                <input
                    id="search"
                    type="search"
                    placeholder="Search dishes..."
                    aria-label="Search dishes"
                >
            </div>
        </div>
    </header>
    <main>
        
        <section id="menu" aria-label="menu"></section>
        <aside id="cart" aria-label="your order" ></aside>
    </main>

    <footer><p>Megenagna, Addis Ababa . Telebirr</p></footer>
    <script src="app.js"></script>
</body>
</html>
